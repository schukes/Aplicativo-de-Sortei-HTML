<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sorteio Corporativo</title>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');
:root{--primaria:#388E3C;--secundaria:#66BB6A;--fundo:#E8F5E9;--texto:#2E3A42;--card:#fff;--excluir:#E53935;--aviso:#FF9800;--azul:#42A5F5;--ok:#4CAF50;--borda:#C8E6C9}
body.tema-escuro{--primaria:#1B5E20;--secundaria:#43A047;--fundo:#102117;--texto:#E0E0E0;--card:#1E2722;--borda:#2E7D32}
*{box-sizing:border-box}
body{font-family:'Montserrat',Arial,sans-serif;background:linear-gradient(135deg,var(--secundaria),var(--primaria));color:var(--texto);margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.container{background:var(--card);padding:25px 30px;border-radius:18px;box-shadow:0 15px 40px rgba(0,0,0,.25);max-width:1100px;width:100%;display:flex;flex-direction:column;gap:15px}
.topo{display:flex;justify-content:space-between;align-items:center;gap:15px}
#titulo{flex:1;min-width:0;font:900 1.9em 'Montserrat',Arial,sans-serif;color:var(--primaria);background:transparent;border:0;border-bottom:3px solid var(--secundaria);padding:0 0 8px;outline:none}
#titulo:focus{border-bottom-color:var(--azul)}
button{font-family:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--azul);outline-offset:2px}
.btn-tema{padding:8px 16px;border-radius:20px;border:0;cursor:pointer;font-weight:700;background:var(--primaria);color:#fff}
.progress-container{background:var(--fundo);border-radius:10px;border:1px solid var(--borda);overflow:hidden;position:relative;height:20px}
.progress-bar{height:100%;width:0;background:linear-gradient(90deg,var(--secundaria),var(--primaria));transition:width .3s}
.progress-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--texto)}
.content-wrapper{display:flex;gap:20px}
.lista-secao{flex:1;min-width:0;display:flex;flex-direction:column}
.titulo-com-acoes{display:flex;justify-content:space-between;align-items:center;margin:0 0 8px}
.titulo-com-acoes h2{font-size:1.1em;margin:0;color:var(--primaria)}
.titulo-com-acoes button{padding:0;font-size:14px;height:30px;width:30px;border-radius:8px;margin-left:5px}
.lista-box{background:var(--fundo);border:1px solid var(--secundaria);border-radius:10px;padding:8px 12px;font-size:14px;height:200px;overflow-y:auto;user-select:none}
.lista-box ul,.log-box ul{list-style:none;margin:0;padding:0}
.lista-box li{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px dashed #ccc}
.lista-box li:last-child{border-bottom:0}
.btn-excluir{background:none;border:0;color:var(--excluir);font-weight:700;cursor:pointer;padding:0 5px}
.input-area{display:flex;gap:8px;margin-top:8px}
.input-area input[type=text]{flex:1;min-width:0;padding:8px 10px;font-size:14px;border-radius:8px;border:1px solid #ccc}
.input-area input[type=file]{flex:1;min-width:0;font-size:13px}
.btn-acao{color:#fff;border:0;padding:10px 18px;font-size:14px;font-weight:700;border-radius:50px;cursor:pointer}
.titulo-com-acoes .btn-acao{padding:0}
#btnSortear{background:var(--primaria);font-size:18px;width:100%}
.resultado{font-size:14px;font-weight:700;text-align:center}
.linha-auto{display:flex;align-items:center;gap:15px;flex-wrap:wrap;font-size:13px}
.linha-auto input[type=number]{width:60px;padding:4px;border-radius:6px;border:1px solid #ccc}
.linha-auto .btn-acao{padding:6px 14px;font-size:12px}
.log-box{font-size:12px;max-height:120px;overflow-y:auto;border-top:1px dashed #ccc;padding-top:6px}
.log-box li{padding:2px 0}.ausente{text-decoration:line-through;opacity:.6}
#aviso{display:none;background:var(--aviso);color:#000;border-radius:8px;padding:8px;font-size:13px;font-weight:700}
#overlay{display:none;position:fixed;inset:0;background:radial-gradient(circle at top,#1b5e20 0,#000 60%);z-index:9999;color:#fff;text-align:center;justify-content:center;align-items:center;flex-direction:column;padding:20px}
.ov-titulo{font-size:1.4vw;color:#A5D6A7;margin-bottom:14px;font-weight:700}
.ov-sub{font-size:1.6vw;color:#C8E6C9;margin-bottom:5px;text-transform:uppercase;letter-spacing:4px}
.ov-cont{font-size:1vw;color:#A5D6A7;margin-bottom:10px}
#textoFS{font-size:7vw;font-weight:900;padding:20px;line-height:1.1;text-shadow:0 0 25px rgba(102,187,106,.9);overflow-wrap:anywhere;max-width:90vw}
.rolando{animation:roll .1s linear infinite}
@keyframes roll{0%{opacity:.2}50%{opacity:1}100%{opacity:.2}}
.zoom{animation:zoom .8s ease-out forwards}
@keyframes zoom{0%{transform:scale(.8);opacity:.3}60%{transform:scale(1.1);opacity:1}100%{transform:scale(1)}}
@media(prefers-reduced-motion:reduce){.rolando,.zoom{animation:none}}
#btnFechar{position:absolute;top:20px;right:20px;background:rgba(255,255,255,.1);color:#fff;border:2px solid #fff;border-radius:50%;width:48px;height:48px;font-size:22px;cursor:pointer;display:none}
.ov-botoes{margin-top:12px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.ov-botoes button{padding:8px 18px;border-radius:20px;border:0;cursor:pointer;font-weight:700;color:#fff}
#btnProximo{background:#43A047}#btnAusente{background:var(--aviso);color:#000}#btnPararAuto{background:#E53935}
.ov-botoes button:disabled{opacity:.4;cursor:not-allowed}
.ov-instr{margin-top:12px;font-size:.9vw;color:#c8e6c9;font-weight:700;display:none}
@media(max-width:700px){.content-wrapper{flex-direction:column}.ov-titulo,.ov-sub{font-size:4vw}.ov-cont,.ov-instr{font-size:3vw}#textoFS{font-size:12vw}.topo{flex-wrap:wrap}}
.print-container{display:none}
@media print{body>*:not(.print-container){display:none!important}.print-container{display:block!important;background:#fff;color:#000;font-family:Arial,sans-serif;padding:20px}.print-container h1{border-bottom:2px solid #ccc;padding-bottom:10px}.print-container li{padding:5px 0;border-bottom:1px dotted #ccc;font-size:14pt}}
</style>
</head>
<body>
<div id="overlay">
  <button id="btnFechar" aria-label="Fechar tela cheia">✕</button>
  <div class="ov-titulo" id="ovTitulo"></div>
  <div class="ov-sub" id="ovSub">Sorteando...</div>
  <div class="ov-cont" id="ovCont"></div>
  <div id="textoFS">Nome</div>
  <div class="ov-botoes">
    <button id="btnProximo">Próximo</button>
    <button id="btnAusente" title="Descarta este vencedor e sorteia outro">Vencedor ausente</button>
    <button id="btnPararAuto" style="display:none">Parar Auto</button>
  </div>
  <div class="ov-instr" id="ovInstr"></div>
</div>

<div class="container">
  <div class="topo">
    <input id="titulo" type="text" maxlength="80" placeholder="Título do sorteio" aria-label="Título do sorteio" />
    <button id="btnTema" class="btn-tema">Alternar Tema</button>
  </div>
  <div id="aviso"></div>
  <div class="progress-container"><div id="progressBar" class="progress-bar"></div><div id="progressLabel" class="progress-label">0 / 0 sorteados</div></div>

  <div class="content-wrapper">
    <div class="lista-secao">
      <div class="titulo-com-acoes"><h2>Candidatos (<span id="contCand">0</span>)</h2>
        <div><button id="btnLimparCand" class="btn-acao" style="background:var(--excluir)" title="Limpar candidatos" aria-label="Limpar todos os candidatos">🗑️</button></div></div>
      <div class="lista-box" id="listaNomes"></div>
      <div class="input-area"><input type="text" id="novoNome" placeholder="Adicionar novo nome (Enter)" aria-label="Novo nome" />
        <button id="btnAdicionar" class="btn-acao" style="background:var(--azul)" title="Adicionar" aria-label="Adicionar nome">➕</button></div>
      <div class="input-area"><input type="file" id="arquivoNomes" accept=".txt,.csv" aria-label="Arquivo de nomes" />
        <button id="btnImportar" class="btn-acao" style="background:var(--secundaria)" title="Importar lista" aria-label="Importar lista">📦</button></div>
    </div>
    <div class="lista-secao">
      <div class="titulo-com-acoes"><h2>Sorteados (Vencedores)</h2>
        <div>
          <button id="btnImprimir" class="btn-acao" style="background:var(--azul)" title="Imprimir" aria-label="Imprimir vencedores">🖨️</button>
          <button id="btnCSV" class="btn-acao" style="background:var(--ok)" title="Exportar CSV" aria-label="Exportar CSV">📄</button>
          <button id="btnReset" class="btn-acao" style="background:var(--aviso)" title="Voltar para candidatos" aria-label="Devolver sorteados aos candidatos">↩️</button>
          <button id="btnLimparSort" class="btn-acao" style="background:var(--excluir)" title="Excluir sorteados" aria-label="Excluir sorteados">🗑️</button>
        </div></div>
      <div class="lista-box" id="listaSorteados"></div>
    </div>
  </div>

  <button id="btnSortear" class="btn-acao">INICIAR SORTEIO EM TELA CHEIA</button>
  <div class="linha-auto">
    <label><input type="checkbox" id="chkAuto" /> Modo automático (sorteia até acabar)</label>
    <label>Intervalo (segundos): <input type="number" id="intervalo" min="1" max="60" value="5" /></label>
    <button id="btnBackup" class="btn-acao" style="background:var(--primaria)" title="Baixar cópia de segurança">💾 Backup</button>
    <button id="btnRestaurar" class="btn-acao" style="background:var(--primaria)" title="Restaurar de um backup">📥 Restaurar</button>
    <input type="file" id="arqBackup" accept=".json" hidden />
  </div>
  <div class="resultado" id="resultado">Aguardando início...</div>
  <div class="log-box"><strong>Log de sorteios (data/hora):</strong><ul id="logSorteios"></ul></div>
</div>
<div class="print-container"></div>

<script>
const CHAVE = 'sorteio_estado_v2';
const $ = id => document.getElementById(id);
let E = { titulo: 'Sorteio Corporativo', nomes: [], sorteados: [], log: [], tema: 'claro', auto: false, intervalo: 5 };
let sorteando = false, autoId = null, rodadaId = 0, audioCtx = null;

/* ---------- Persistência (gravada a cada mudança, e ANTES da animação) ---------- */
function carregar() {
  try {
    const d = localStorage.getItem(CHAVE);
    if (d) { E = Object.assign(E, JSON.parse(d)); return; }
    const v = k => JSON.parse(localStorage.getItem(k) || 'null'); // migra versão antiga
    E.nomes = v('sorteio_candidatos') || []; E.sorteados = v('sorteio_sorteados') || []; E.log = v('sorteio_log') || [];
  } catch (e) { avisar('Não foi possível ler os dados salvos.'); }
}
function salvar() {
  try { localStorage.setItem(CHAVE, JSON.stringify(E)); $('aviso').style.display = 'none'; return true; }
  catch (e) { avisar('⚠️ Não foi possível salvar no navegador. Use 💾 Backup para não perder os dados.'); return false; }
}
function avisar(m) { const a = $('aviso'); a.textContent = m; a.style.display = 'block'; }
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

/* ---------- Auxiliares ---------- */
function randInt(max) { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % max; }
const sleep = ms => new Promise(r => setTimeout(r, ms));
const chave = n => n.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
const existe = n => { const k = chave(n); return E.nomes.some(x => chave(x) === k) || E.sorteados.some(x => chave(x) === k); };
const total = () => E.nomes.length + E.sorteados.length;
const tituloAtual = () => E.titulo.trim() || 'Sorteio Corporativo';

/* ---------- Sons ---------- */
function audio() {
  if (!audioCtx) { const C = window.AudioContext || window.webkitAudioContext; if (C) audioCtx = new C(); }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function tom(freq, ini, dur, tipo, vol) {
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = tipo; o.frequency.setValueAtTime(freq, ini);
  g.gain.setValueAtTime(vol, ini); g.gain.exponentialRampToValueAtTime(0.0001, ini + dur);
  o.connect(g); g.connect(audioCtx.destination); o.start(ini); o.stop(ini + dur);
}
function beep() { if (audioCtx && audioCtx.state === 'running') tom(850, audioCtx.currentTime, 0.05, 'sawtooth', 0.3); }
function melodia() {
  if (!audioCtx || audioCtx.state !== 'running') return;
  let t = audioCtx.currentTime;
  [[523.25, .12], [659.25, .12], [783.99, .15], [987.77, .2], [1174.66, .25]].forEach(([f, d]) => { tom(f, t, d, 'triangle', 0.18); t += d * 0.9; });
  tom(110, audioCtx.currentTime, 0.4, 'sine', 0.4);
}

/* ---------- Renderização (DOM seguro, sem innerHTML) ---------- */
function render() {
  const ul = document.createElement('ul');
  [...E.nomes].sort((a, b) => a.localeCompare(b, 'pt-BR', { sensitivity: 'base' })).forEach(nome => {
    const li = document.createElement('li'), sp = document.createElement('span'), b = document.createElement('button');
    sp.textContent = nome; b.className = 'btn-excluir'; b.textContent = 'X'; b.title = 'Remover'; b.setAttribute('aria-label', 'Remover ' + nome);
    b.addEventListener('click', () => removerNome(nome));
    li.append(sp, b); ul.appendChild(li);
  });
  $('listaNomes').replaceChildren(ul);
  const us = document.createElement('ul');
  E.sorteados.forEach((nome, i) => { const li = document.createElement('li'); li.textContent = `${E.sorteados.length - i}º: ${nome}`; us.appendChild(li); });
  $('listaSorteados').replaceChildren(us);
  $('contCand').textContent = E.nomes.length;
  const pct = total() ? (E.sorteados.length / total()) * 100 : 0;
  $('progressBar').style.width = pct + '%';
  $('progressLabel').textContent = `${E.sorteados.length} / ${total()} sorteados`;
  const ul2 = document.createElement('ul');
  E.log.forEach(it => {
    const li = document.createElement('li');
    li.textContent = `${it.ordem}º - ${it.nome} (${it.dataHora})${it.status === 'ausente' ? ' - ausente' : ''}`;
    if (it.status === 'ausente') li.className = 'ausente';
    ul2.appendChild(li);
  });
  $('logSorteios').replaceChildren(ul2);
  $('titulo').value = E.titulo; $('ovTitulo').textContent = tituloAtual(); document.title = tituloAtual();
  document.body.classList.toggle('tema-escuro', E.tema === 'escuro');
  $('chkAuto').checked = E.auto; $('intervalo').value = E.intervalo;
}
function mudou() { salvar(); render(); }

/* ---------- Tela cheia ---------- */
const overlayAberto = () => $('overlay').style.display === 'flex';
function abrirTelaCheia() {
  $('overlay').style.display = 'flex'; $('btnFechar').style.display = 'none'; $('ovInstr').style.display = 'none';
  $('btnProximo').disabled = true; $('btnAusente').disabled = true;
  $('btnPararAuto').style.display = E.auto ? 'inline-block' : 'none';
  if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
}
function fecharTelaCheia() {
  rodadaId++; sorteando = false; cancelarAuto();
  $('overlay').style.display = 'none';
  if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
  render();
}
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && overlayAberto()) fecharTelaCheia(); });

function confete() {
  if (!window.confetti) return;
  const c = { startVelocity: 40, spread: 360, ticks: 100, zIndex: 10000, particleCount: 120, origin: { y: 0.6 }, colors: ['#66BB6A', '#388E3C', '#FFFFFF', '#FFEB3B'] };
  confetti(c); setTimeout(() => confetti(c), 400);
}

/* ---------- Sorteio ---------- */
async function rodada() {
  const fs = $('textoFS');
  if (E.nomes.length === 0) {
    fs.textContent = 'FIM'; $('ovSub').textContent = 'Todos os candidatos foram sorteados!';
    $('ovInstr').style.display = 'none'; $('btnFechar').style.display = 'block';
    $('btnProximo').disabled = true; $('btnAusente').disabled = !E.sorteados.length; $('btnPararAuto').style.display = 'none';
    sorteando = false; cancelarAuto(); return;
  }
  const minha = ++rodadaId; sorteando = true;
  const pool = [...E.nomes];
  const idx = randInt(E.nomes.length), vencedor = E.nomes[idx];

  // O vencedor é definido e SALVO antes da animação: queda de energia não perde nem repete o resultado.
  const restantes = E.nomes.length;
  E.nomes.splice(idx, 1); E.sorteados.unshift(vencedor);
  E.log.unshift({ ordem: E.sorteados.length, nome: vencedor, dataHora: new Date().toLocaleString('pt-BR'), restantes, status: 'ok' });
  salvar();

  fs.classList.remove('zoom'); fs.style.color = '#fff'; fs.classList.add('rolando');
  $('ovSub').textContent = `Sorteando o ${E.sorteados.length}º vencedor...`;
  $('ovCont').textContent = `Sorteio ${E.sorteados.length} de ${total()}`;
  $('ovInstr').style.display = 'none'; $('btnFechar').style.display = 'none';
  $('btnProximo').disabled = true; $('btnAusente').disabled = true;

  const ciclos = 30 + randInt(20);
  for (let i = 0; i < ciclos; i++) {
    beep(); fs.textContent = pool[randInt(pool.length)];
    await sleep(50 + Math.pow(i / ciclos, 3) * 280);
    if (minha !== rodadaId) return; // overlay fechado: o vencedor já está salvo
  }
  fs.classList.remove('rolando'); fs.textContent = vencedor; fs.style.color = '#66BB6A'; fs.classList.add('zoom');
  $('ovSub').textContent = '🎉 VENCEDOR(A) 🎉';
  melodia(); confete();
  $('resultado').textContent = `Último sorteado: ${vencedor}`;
  render();
  sorteando = false; $('btnFechar').style.display = 'block'; $('btnAusente').disabled = false;

  if (E.nomes.length > 0) {
    $('ovInstr').textContent = `Aperte ESPAÇO ou clique em "Próximo" para o ${E.sorteados.length + 1}º sorteio.`;
    $('ovInstr').style.display = 'block'; $('btnProximo').disabled = false;
    if (E.auto) { agendarAuto(); $('btnPararAuto').style.display = 'inline-block'; }
  } else { $('ovInstr').style.display = 'none'; $('btnPararAuto').style.display = 'none'; cancelarAuto(); }
}
async function iniciarSorteio() {
  if (E.nomes.length === 0) return alert('Adicione candidatos antes de iniciar.');
  audio(); abrirTelaCheia(); await rodada();
}
async function proximo() { if (sorteando) return; cancelarAuto(); await rodada(); }
async function marcarAusente() {
  if (sorteando || !E.sorteados.length) return;
  const nome = E.sorteados.shift();
  const l = E.log.find(x => x.nome === nome && x.status === 'ok'); if (l) l.status = 'ausente';
  mudou(); await rodada();
}
function agendarAuto() {
  cancelarAuto();
  autoId = setTimeout(() => { if (overlayAberto() && E.nomes.length && !sorteando) proximo(); }, (parseInt(E.intervalo, 10) || 5) * 1000);
}
function cancelarAuto() { if (autoId) { clearTimeout(autoId); autoId = null; } }

/* ---------- Nomes ---------- */
function adicionarNome() {
  const n = $('novoNome').value.replace(/\s+/g, ' ').trim();
  if (!n) return alert('Digite um nome válido.');
  if (existe(n)) return alert('Nome já existe.');
  E.nomes.push(n); $('novoNome').value = ''; mudou();
}
function primeiraColuna(l) { return l.split(/[;,\t]/)[0].replace(/^["']|["']$/g, '').replace(/\s+/g, ' ').trim(); }
function lerTexto(buf) {
  let t;
  try { t = new TextDecoder('utf-8', { fatal: true }).decode(buf); } catch (e) { t = new TextDecoder('windows-1252').decode(buf); }
  return t.replace(/^\uFEFF/, '');
}
function importarNomes() {
  const f = $('arquivoNomes').files[0];
  if (!f) return alert('Selecione um arquivo .txt ou .csv com um nome por linha.');
  const r = new FileReader();
  r.onload = e => {
    let add = 0, ign = 0;
    lerTexto(e.target.result).split(/\r?\n/).map(primeiraColuna).filter(Boolean).forEach(n => { if (existe(n)) ign++; else { E.nomes.push(n); add++; } });
    $('arquivoNomes').value = ''; mudou();
    alert(`${add} nomes importados.\n${ign} ignorados (já existiam).`);
  };
  r.onerror = () => alert('Erro ao ler o arquivo.');
  r.readAsArrayBuffer(f);
}
function removerNome(n) { if (confirm(`Remover "${n}"?`)) { E.nomes = E.nomes.filter(x => x !== n); mudou(); } }
function limparCandidatos() {
  if (!E.nomes.length) return alert('Lista de candidatos já está vazia.');
  if (!confirm('Apagar TODOS os candidatos?')) return;
  E.nomes = []; mudou(); $('resultado').textContent = 'Lista de candidatos limpa.';
}
function limparSorteados() {
  if (!E.sorteados.length) return alert('Lista de sorteados vazia.');
  if (!confirm('Limpar vencedores e o log? Os nomes serão perdidos.')) return;
  E.sorteados = []; E.log = []; mudou();
}
function resetarSorteados() {
  if (!E.sorteados.length) return alert('Lista de sorteados vazia.');
  if (!confirm('Devolver os sorteados para os candidatos? O log será apagado.')) return;
  E.nomes = E.nomes.concat(E.sorteados); E.sorteados = []; E.log = []; mudou();
}

/* ---------- Impressão, CSV e backup ---------- */
function imprimir() {
  if (!E.sorteados.length) return alert('Nada para imprimir.');
  const pc = document.querySelector('.print-container'), h = document.createElement('h1'), ul = document.createElement('ul');
  h.textContent = `${tituloAtual()} - Vencedores`;
  E.sorteados.forEach((n, i) => { const li = document.createElement('li'); li.textContent = `${E.sorteados.length - i}º: ${n}`; ul.appendChild(li); });
  pc.replaceChildren(h, ul); window.print(); pc.replaceChildren();
}
function baixar(conteudo, tipo, nome) {
  const url = URL.createObjectURL(new Blob([conteudo], { type: tipo }));
  const a = document.createElement('a'); a.href = url; a.download = nome;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}
const slug = () => tituloAtual().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^\w]+/g, '_').toLowerCase();
function exportarCSV() {
  if (!E.log.length) return alert('Nenhum vencedor para exportar.');
  const q = s => `"${String(s).replace(/"/g, '""')}"`;
  const linhas = ['sorteio;ordem;nome;data_hora;status;candidatos_restantes_antes'];
  [...E.log].reverse().forEach(l => linhas.push([q(tituloAtual()), l.ordem, q(l.nome), q(l.dataHora), l.status, l.restantes ?? ''].join(';')));
  baixar('\uFEFF' + linhas.join('\r\n'), 'text/csv;charset=utf-8;', `vencedores_${slug()}.csv`);
}
function backup() { baixar(JSON.stringify(E, null, 2), 'application/json', `backup_${slug()}.json`); }
function restaurar() {
  const f = $('arqBackup').files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = e => {
    try {
      const d = JSON.parse(e.target.result);
      if (!Array.isArray(d.nomes) || !Array.isArray(d.sorteados)) throw 0;
      if (!confirm('Substituir os dados atuais pelo backup?')) return;
      E = Object.assign(E, d); E.log = Array.isArray(d.log) ? d.log : []; mudou();
    } catch (x) { alert('Arquivo de backup inválido.'); }
    $('arqBackup').value = '';
  };
  r.readAsText(f);
}

/* ---------- Eventos ---------- */
$('titulo').addEventListener('input', e => { E.titulo = e.target.value; salvar(); $('ovTitulo').textContent = tituloAtual(); document.title = tituloAtual(); });
$('btnTema').addEventListener('click', () => { E.tema = E.tema === 'escuro' ? 'claro' : 'escuro'; mudou(); });
$('btnSortear').addEventListener('click', iniciarSorteio);
$('btnAdicionar').addEventListener('click', adicionarNome);
$('novoNome').addEventListener('keyup', e => { if (e.key === 'Enter') adicionarNome(); });
$('btnImportar').addEventListener('click', importarNomes);
$('btnLimparCand').addEventListener('click', limparCandidatos);
$('btnLimparSort').addEventListener('click', limparSorteados);
$('btnReset').addEventListener('click', resetarSorteados);
$('btnImprimir').addEventListener('click', imprimir);
$('btnCSV').addEventListener('click', exportarCSV);
$('btnBackup').addEventListener('click', backup);
$('btnRestaurar').addEventListener('click', () => $('arqBackup').click());
$('arqBackup').addEventListener('change', restaurar);
$('chkAuto').addEventListener('change', e => {
  E.auto = e.target.checked; salvar();
  if (!E.auto) { cancelarAuto(); $('btnPararAuto').style.display = 'none'; }
  else if (overlayAberto() && !sorteando && E.nomes.length) { agendarAuto(); $('btnPararAuto').style.display = 'inline-block'; }
});
$('intervalo').addEventListener('change', e => {
  E.intervalo = Math.min(60, Math.max(1, parseInt(e.target.value, 10) || 5)); salvar();
  if (E.auto && overlayAberto() && !sorteando && E.nomes.length) agendarAuto();
});
$('btnFechar').addEventListener('click', fecharTelaCheia);
$('btnProximo').addEventListener('click', e => { e.currentTarget.blur(); proximo(); });
$('btnAusente').addEventListener('click', e => { e.currentTarget.blur(); marcarAusente(); });
$('btnPararAuto').addEventListener('click', () => { E.auto = false; salvar(); $('chkAuto').checked = false; cancelarAuto(); $('btnPararAuto').style.display = 'none'; });
document.addEventListener('keydown', e => {
  if (!overlayAberto()) return;
  if (e.code === 'Space' && !sorteando && E.nomes.length) { e.preventDefault(); if (document.activeElement) document.activeElement.blur(); proximo(); }
  else if (e.key === 'Escape') fecharTelaCheia();
});

/* ---------- Início ---------- */
carregar(); render();
if (E.log.length) $('resultado').textContent = `Sorteio retomado. Último sorteado: ${E.log.find(l => l.status === 'ok')?.nome ?? '-'}`;
</script>
</body>
</html>
